stages:
  - build
  - deploy

build-backend:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "PROD"'
  script:
    - cd backend/Api_Gateway
    - docker build --no-cache -t aurora_api_gateway .
    - cd ../SSO
    - docker build --no-cache -t aurora_sso .

build-frontend:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "PROD"'
  script:
    - cd frontend
    - docker build --no-cache -t frontend .

deploy-staging:
  stage: deploy

  rules:
    - if: '$CI_COMMIT_BRANCH == "PROD"'
  script:
    - |
      docker-compose down || true
      docker-compose up -d --build
      docker image prune -f
