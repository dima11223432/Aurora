stages:
  - test
  - deploy

.test-template: &test-template
  stage: test
  before_script:
    - cd backend
    - cp "$ENV_FILE" .env
    - docker-compose build sso-tests recommendation-service-tests cache-service-tests
  only:
    - PROD
    - feature/env

test-sso:
  <<: *test-template
  script:
    - docker-compose run --rm sso-tests

test-recommendation:
  <<: *test-template
  script:
    - docker-compose down -v --remove-orphans
    - docker-compose build --no-cache recommendation-service-tests
    - docker-compose run --rm recommendation-service-tests

test-cache-service:
  <<: *test-template
  script:
    - docker-compose run --rm cache-service-tests

deploy-staging:
  stage: deploy
  script:
    - cd backend
    - cp "$ENV_FILE" .env
    - docker-compose down --remove-orphans
    - docker-compose build
    - docker-compose up -d
    - docker image prune -f
  only:
    - PROD
    - feature/env
