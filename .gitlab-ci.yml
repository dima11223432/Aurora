stages:
  - deploy

deploy-staging:
  stage: deploy
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - cd backend
    - docker-compose down --remove-orphans || true
    - docker-compose build
    - docker-compose up -d
