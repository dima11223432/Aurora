generate-docs:
  stage: docs
  before_script:
    - cd backend
    - pip install sphinx sphinx_rtd_theme 2>/dev/null || true
  script:
    - make doc-gen-all
  artifacts:
    paths:
      - backend/docs/
    expire_in: 30 days
  only:
    - main

deploy-staging:
  stage: deploy
  script:
    - cd backend
    - cp "$ENV_FILE" .env
    - docker-compose down --remove-orphans
    - docker-compose build
    - docker-compose up -d
    - docker image prune -f
  only:
    - PROD
    - main
