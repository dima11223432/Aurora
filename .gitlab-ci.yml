stages:
  - test
  - deploy

test-sso:
  stage: test
  image: docker:24-cli
  services:
    - docker:24-cli-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: ""
  script:
    - cp "$ENV_FILE" backend/SSO/.env
    - cd backend/SSO
    - docker build -t sso-test .
    - docker run --rm --network aurora_aurora-network --env-file .env sso-test go test -coverprofile=coverage.out ./...
    - docker run --rm -v $(pwd):/workspace sso-test go tool cover -html=coverage.out -o coverage.html
  coverage: '/coverage: \d+\.\d+%/'
  artifacts:
    paths:
      - backend/SSO/coverage.html
      - backend/SSO/coverage.out
    expire_in: 7 days

test-recommendation-service:
  stage: test
  image: docker:24-cli
  services:
    - docker:24-cli-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: ""
  script:
    - cp "$ENV_FILE" backend/Recommendation_Service/.env
    - cd backend/Recommendation_Service
    - docker build -t recommendation-service-test .
    - docker run --rm --network aurora_aurora-network --env-file .env recommendation-service-test go test -coverprofile=coverage.out ./...
    - docker run --rm -v $(pwd):/workspace recommendation-service-test go tool cover -html=coverage.out -o coverage.html
  coverage: '/coverage: \d+\.\d+%/'
  artifacts:
    paths:
      - backend/Recommendation_Service/coverage.html
      - backend/Recommendation_Service/coverage.out
    expire_in: 7 days

deploy-staging:
  stage: deploy
  script:
    - cd backend
    - cp "$ENV_FILE" .env
    - docker-compose down --remove-orphans
    - docker-compose build
    - docker-compose up -d
    - docker image prune -f
  only:
    - PROD
    - feature/env
