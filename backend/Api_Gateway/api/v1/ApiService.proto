syntax = "proto3";

import "google/api/annotations.proto";

package api.v1;

option go_package = "api/v1/ApiService";

service ApiService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }

  rpc IsAdmin(IsAdminRequest) returns (IsAdminResponse) {
    option (google.api.http) = {
      post: "/v1/is_admin"
      body:"*"
    };
  }
  rpc SetPriorityChannels(SetPriorityChannelsRequest) returns (SetPriorityChannelsResponse) {
    option (google.api.http) = {
      post: "/v1/set_priority_channels"
      body:"*"
    };
  }
}

message SetPriorityChannelsRequest {
  repeated int64 priority_channels = 1;
}

message SetPriorityChannelsResponse {
  int32 status = 1;
}


message LoginRequest {
  int64 telegram_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  bool is_admin = 5;
  int64 app_id = 6;
}

message LoginResponse {
  string token = 1;
}

message IsAdminRequest {
  int64 telegram_id = 1;
}

message IsAdminResponse {
  bool is_admin = 1;
}
