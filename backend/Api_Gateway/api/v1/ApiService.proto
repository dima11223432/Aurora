syntax = "proto3";

import "google/api/annotations.proto";

package api.v1;

option go_package = "api/v1/ApiService";

service ApiService {

  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (google.api.http) = {
      post: "/v1/groups"
      body: "*"
    };
  }

  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {
    option (google.api.http) = {
      post: "/v1/groups/delete"
      body: "*"
    };
  }

  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {
    option (google.api.http) = {
      post: "/v1/groups/update"
      body: "*"
    };
  }

  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse) {
    option (google.api.http) = {
      post: "/v1/contacts"
      body: "*"
    };
  }

  rpc GetAllContactsByGroupID(GetAllContactsByGroupIDRequest) returns (GetAllContactsByGroupIDResponse) {
    option (google.api.http) = {
      get: "/v1/contacts/{group_id}"
    };
  }

  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse) {
    option (google.api.http) = {
        patch:"/v1/contacts/{id}"
        body: "*"
    };
  }

  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse) {
    option (google.api.http) = {
        delete:"/v1/contacts/{id}"
    };
  }

  rpc CreateNotification(CreateNotificationRequest) returns (CreateNotificationResponse) {
    option (google.api.http) = {
      post: "/v1/notifications"
      body: "*"
    };
  }

  rpc UpdateNotification(UpdateNotificationRequest) returns (UpdateNotificationResponse) {
    option (google.api.http) = {
      post: "/v1/notifications/update"
      body: "*"
    };
  }

  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse) {
    option (google.api.http) = {
      post: "/v1/notifications/send"
      body: "*"
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }

  rpc IsAdmin(IsAdminRequest) returns (IsAdminResponse) {
    option (google.api.http) = {
      post: "/v1/is_admin"
      body: "*"
    };
  }
}

message Contact{
  int64 id = 1;
  string email = 2;
}

message Group{
  int64 id = 1;
  string name = 2;
  repeated Contact contacts = 3;
}

message DeleteGroupRequest {
  int64 id = 1;
}

message DeleteGroupResponse {
  bool success = 1;
}

message UpdateGroupRequest {
  int64 id = 1;
  string name = 2;
}

message UpdateGroupResponse {
  bool success = 1;
}

message GetAllContactsByGroupIDRequest{
  int64 group_id =1;
}

message GetAllContactsByGroupIDResponse{
  repeated Contact contacts = 1;
}

message DeleteContactRequest {
  int64 id = 1;
}

message DeleteContactResponse {
  bool success = 1;
}

message UpdateContactRequest {
  int64 id = 1;
  string email = 2;
}

message UpdateContactResponse {
  bool success = 1;
}

message UpdateNotificationRequest {
  int64 id = 1;
  string title = 2;
  string text = 3;
}

message UpdateNotificationResponse {
  bool success = 1;
}

 message SendNotificationRequest{
   int64 notification_id = 1;
   int64 group_id = 2;
 }

message SendNotificationResponse{
  string event_id = 1;
  string status = 2;
}

message CreateGroupRequest {
  string name = 1;
}

message CreateGroupResponse {
  int64 id = 1;
  string Name = 2;
}

message GetAllGroupsRequest {
  int64 user_id = 1;
}
 message GetAllGroupsResponse {
  repeated Group groups = 1;
}

message CreateContactRequest {
  string email = 1;
  int64 group_id = 2;
}

message CreateContactResponse {
  int64 id = 1;
}

message CreateNotificationRequest {
  string title = 1;
  string text = 2;
  int64 group_id = 3;
}

message CreateNotificationResponse {
  int64 id = 1;
  string title = 2;
  string text = 3;
}

message RegisterRequest{
  string email = 1;
  string password = 2;
  bool is_admin = 3;
}

message RegisterResponse{
  int64 user_id = 1;
}

message LoginRequest{
  string email = 1;
  string password = 2;
  int32 app_id = 3;
}

message LoginResponse{
  string token = 1;
}

message IsAdminRequest{
  int64 user_id = 1;
}

message IsAdminResponse{
  bool is_admin = 1;
}
