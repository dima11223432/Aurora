version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: self_improvement_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: self_improvement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurora-network

  redis-master:
    image: redis:7-alpine
    container_name: redis_master
    restart: unless-stopped
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --requirepass "1111"
      --masterauth "1111"
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1111", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aurora-network

  redis-replica:
    image: redis:7-alpine
    container_name: redis_replica
    restart: unless-stopped
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --requirepass "1111"
      --masterauth "1111"
      --replicaof redis-master 6379
      --appendonly yes
    depends_on:
      - redis-master
    ports:
      - "6380:6379"
    volumes:
      - redis_replica_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1111", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aurora-network

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis_sentinel_1
    restart: unless-stopped
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
    ports:
      - "26379:26379"
    volumes:
      - ./redis-sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - aurora-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - aurora-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurora-network

  api-gateway:
    build:
      context: .
      dockerfile: dockerfile
    container_name: aurora-api-gateway
    ports:
      - "8081:8081"
      - "44000:44000"
    volumes:
      - ./config:/app/config
    environment:
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=1111
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=self_improvement
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
    command: ["./main", "--config", "/app/config/local.yaml"]
    depends_on:
      redis-master:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aurora-network

networks:
  aurora-network:
    driver: bridge

volumes:
  postgres_data:
  redis_master_data:
  redis_replica_data:
