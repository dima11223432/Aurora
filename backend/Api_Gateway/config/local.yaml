env: "local"

storage_pass: "postgres://postgres:pass@localhost:5432/aurora?sslmode=disable"

auth:
  jwt_secret: "test-secret"
  cors_urls:
    - "*"
  public_methods:
    - "/api.v1.ApiService/Register"
    - "/api.v1.ApiService/Login"
    - "/api.v1.ApiService/HealthCheck"
