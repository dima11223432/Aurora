services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: aurora-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1ux35qBk4YgCMsd7eg4ju}
      POSTGRES_DB: aurora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurora-network

  postgres-parser:
    image: postgres:15-alpine
    container_name: aurora-parser-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1ux35qBk4YgCMsd7eg4ju}
      POSTGRES_DB: parser
    volumes:
      - postgres_parser_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurora-network

  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    restart: unless-stopped
    mem_limit: 512m
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --requirepass "${REDIS_PASSWORD:-1ux35qBk4YgCMsd7eg4ju}"
      --masterauth "${REDIS_PASSWORD:-1ux35qBk4YgCMsd7eg4ju}"
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_master_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-1ux35qBk4YgCMsd7eg4ju}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aurora-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    mem_limit: 512m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aurora-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    command: sh -c "sleep 3 && /etc/confluent/docker/run"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - aurora-network

  # Services
  api-gateway:
    build:
      context: ./Api_Gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8081:8081"
      - "44043:44043"
    environment:
      - ENV=${ENV}
      - STORAGE_PASS=${STORAGE_PASS}
      - TOKEN_TTL=${TOKEN_TTL}
      - GRPC_PORT=${GRPC_PORT}
      - GRPC_TIMEOUT=${GRPC_TIMEOUT}
      - GRPC_GATEWAY_PORT=${GRPC_GATEWAY_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_URLS=${CORS_URLS}
      - PUBLIC_METHODS=${PUBLIC_METHODS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - SSO_HOST=${SSO_HOST}
      - SSO_PORT=${SSO_PORT}
      - RECS_HOST=${RECS_HOST}
      - RECS_PORT=${RECS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - aurora-network

  sso:
    build:
      context: ./SSO
      dockerfile: Dockerfile
    container_name: sso
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "44044:44044"
    environment:
      - ENV=${ENV}
      - STORAGE_PASS=${STORAGE_PASS}
      - TEST_POSTGRES_DNS=${TEST_POSTGRES_DNS}
      - TOKEN_TTL=${TOKEN_TTL}
      - GRPC_PORT=${SSO_PORT}
      - GRPC_TIMEOUT=${GRPC_TIMEOUT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aurora-network

  recommendation-service:
    build:
      context: ./Recommendation_Service
      dockerfile: Dockerfile
    container_name: recommendation-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "44040:44040"
    environment:
      - ENV=${ENV}
      - API_ID=${API_ID}
      - API_HASH=${API_SECRET}
      - PHONE_NUMBER=${PHONE_NUMBER}
      - STORAGE_PASS=${STORAGE_PASS}
      - PARSING_SERVICE_PASS=${PARSING_SERVICE_PASS}
      - TOKEN_TTL=${TOKEN_TTL}
      - GRPC_PORT=${RECS_PORT}
      - GRPC_TIMEOUT=${GRPC_TIMEOUT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    networks:
      - aurora-network

  cache-service:
    build:
      context: ./Cache_Service
      dockerfile: Dockerfile
    container_name: cache-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "44045:44044"
      - "44046:44045"
    environment:
      - ENV=${ENV}
      - STORAGE_PASS=${STORAGE_PASS}
      - TOKEN_TTL_CACHE=${TOKEN_TTL_CACHE}
      - GRPC_PORT=${CACHE_GRPC_PORT}
      - GRPC_TIMEOUT=${GRPC_TIMEOUT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - KAFKA_HOST=${KAFKA_HOST}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP}
      - KAFKA_MAX_PULLS=${KAFKA_MAX_PULLS}
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - aurora-network

  parsing-service:
    build:
      context: ./Parsing_Service
      dockerfile: Dockerfile
    container_name: parsing-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "44042:44042"
    environment:
      - ENV=${ENV}
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - PROXY_HOST=${PROXY_HOST}
      - PROXY_PORT=${PROXY_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-parser:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - aurora-network

  analytic-service:
    build:
      context: ./Analitic_Service
      dockerfile: Dockerfile
    container_name: analytic-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "44047:44043"
    volumes:
      - ./Analitic_Service/logs:/app/logs
    environment:
      - ENV=${ENV}
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - LOG_LEVEL=INFO
    depends_on:
      kafka:
        condition: service_started
    networks:
      - aurora-network

  frontend-prod:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/v1
        - VITE_SSO_URL=/v1/sso
    container_name: aurora-frontend-prod
    mem_limit: 512m
    ports:
      - "80:80"
      - "443:443"
      - "5173:5173"
    depends_on:
      - api-gateway
      - sso
    networks:
      - aurora-network
    restart: unless-stopped

networks:
  aurora-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_parser_data:
  redis_master_data:

  parsing-service:
    build:
      context: ./Parsing_Service
      dockerfile: Dockerfile
    container_name: parsing-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "44042:44042"
    environment:
      - ENV=${ENV}
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC=${KAFKA_TOPIC_INPUT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - PROXY_HOST=${PROXY_HOST}
      - PROXY_PORT=${PROXY_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-parser:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - aurora-network

  analytic-service:
    build:
      context: ./Analitic_Service
      dockerfile: Dockerfile
    container_name: analytic-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "44047:44043"
    volumes:
      - ./Analitic_Service/logs:/app/logs
    environment:
      - ENV=${ENV}
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - LOG_LEVEL=INFO
    depends_on:
      kafka:
        condition: service_started
    networks:
      - aurora-network

  frontend-prod:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/v1
        - VITE_SSO_URL=/v1/sso
    container_name: aurora-frontend-prod
    mem_limit: 512m
    ports:
      - "80:80"
      - "443:443"
      - "5173:5173"
    depends_on:
      - api-gateway
      - sso
    networks:
      - aurora-network
    restart: unless-stopped

networks:
  aurora-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_parser_data:
  redis_master_data:

