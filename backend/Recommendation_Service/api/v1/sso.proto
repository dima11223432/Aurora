syntax = "proto3";

package recommendation.v1;

option go_package = "recommendation/v1";

service RecommendationService {
  rpc GetUserPriorityChannels(GetUserPriorityChannelsRequest) returns (GetUserPriorityChannelsResponse);
}

message GetUserPriorityChannelsRequest {
  int64 user_id = 1;
}

message GetUserPriorityChannelsResponse{
  repeated string channels = 1;
}

