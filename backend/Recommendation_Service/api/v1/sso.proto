syntax = "proto3";

package recommendation.v1;

option go_package = "recommendation/v1";

service RecommendationService {
  rpc GetUserPriotiryChannels(GetUserPriotiryChannelsRequest) returns (GetUserPriotiryChannelsResponse);
}

message GetUserPriotiryChannelsRequest {
  int64 user_id = 1;
}

message GetUserPriotiryChannelsResponse{
  repeated string channels = 1;
}

